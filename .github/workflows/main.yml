
name: Build Road 2 PITX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          printf '%s\n' '{"name":"road2-pitx","version":"1.0.0","private":true}' > package.json
          printf '%s\n' '{"appId":"com.sitajono437cpu.road2pitx","appName":"Road 2 PITX","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Road-2-PITX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
